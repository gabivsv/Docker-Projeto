<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DockGames</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>
        <span class="icon">🎮</span>
        <span class="title">DockGames</span>
      </h1>
</header>

<section class="hero">
    <h2>Bem-vindo ao DockGames!</h2>
    <p>Escolha um jogo para começar sua aventura.</p>
</section>

<section class="games">

    <a href="http://localhost:8081" class="game-card">
        <div class="game-image pacman"></div>

        <div class="game-info">
            
        <div class="loader-wrapper">
            <div class="packman"></div>
            <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            </div>
        </div>
            <h3>Pac-Man</h3>
            <p>Clássico arcade de labirinto.</p>
            <button>Jogar Agora</button>
        </div>
    </a>

    <a href="http://localhost:8082" class="game-card">

        <div class="game-image arcade">
    
            <div class="snake-wrapper">
    
                <div class="snake">
                    <div class="segment"></div>
                    <div class="segment"></div>
                    <div class="segment"></div>
                    <div class="segment"></div>

                    <div class="head">
                        <div class="eye"></div>
                    </div>
                </div>
    
                <div class="fruit"></div>
    
            </div>
    
        </div>
    
        <div class="game-info">
            <h3>Snake</h3>
            <p>Coma as frutas e cresça sem bater.</p>
            <button>Jogar Agora</button>
        </div>
    
    </a>

    <a href="#" class="game-card">

        <div class="game-image tetris">
    
            <div class="tetris-wrapper">
                <div class="square s1"></div>
                <div class="square s2"></div>
                <div class="square s3"></div>
                <div class="square s4"></div>
                <div class="square s5"></div>
                <div class="square s6"></div>
                <div class="square s7"></div>
                <div class="square s8"></div>
                <div class="square s9"></div>
                <div class="square s10"></div>
            </div>
    
        </div>
    
        <div class="game-info">
            <h3>Tetris</h3>
            <p>Empilhe blocos e complete linhas.</p>
            <button>Jogar Agora</button>
        </div>
    
    </a>

</section>

<footer>
    <p>© 2026 DockGames</p>
</footer>

</body>
</html>
